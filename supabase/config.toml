# Supabase local development configuration
# Generated with `supabase init`

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "visionbuild://auth/callback"
additional_redirect_urls = ["visionbuild://auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true

[auth.external.apple]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
