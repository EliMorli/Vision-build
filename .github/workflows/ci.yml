name: CI

on:
  pull_request:
    branches: [ main, develop, cursor/** ]
  push:
    branches: [ main, develop, cursor/** ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionbuild_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: Check Zod/Database models
        run: npm run check:models
      
      - name: Check dev button gating
        run: npm run check:dev-button
      
      - name: Check no Alert.alert in app
        run: bash scripts/check-no-alert.sh
      
      - name: Check launch copy compliance
        run: npm run check:launch-copy
      
      - name: Install pg_cron and pg_net in PostgreSQL container
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          # Get the container ID for the postgres service
          CONTAINER_ID=$(docker ps --filter "ancestor=postgres:16" --format "{{.ID}}" | head -1)
          
          # Install build dependencies and pg_cron
          docker exec $CONTAINER_ID bash -c "apt-get update && apt-get install -y postgresql-16-cron postgresql-server-dev-16 build-essential git curl libcurl4-openssl-dev libicu-dev"
          
          # Build and install pg_net from source (pinned to v0.20.5)
          docker exec $CONTAINER_ID bash -c "cd /tmp && git clone --branch v0.20.5 --depth 1 https://github.com/supabase/pg_net.git && cd pg_net && make && make install"
          
          # Configure pg_cron and pg_net
          docker exec $CONTAINER_ID bash -c "echo \"shared_preload_libraries = 'pg_cron, pg_net'\" >> /var/lib/postgresql/data/postgresql.conf"
          docker exec $CONTAINER_ID bash -c "echo \"cron.database_name = 'visionbuild_test'\" >> /var/lib/postgresql/data/postgresql.conf"
          
          # Restart PostgreSQL in the container
          docker restart $CONTAINER_ID
          
          # Wait for PostgreSQL to be ready
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
      
      - name: Setup database for tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: visionbuild_test
        run: |
          # Apply shim
          psql -f scripts/db/shim.sql -q
          
          # Seed vault secrets for testing
          psql -c "INSERT INTO vault.decrypted_secrets (name, decrypted_secret) VALUES ('project_url', 'http://localhost:54321') ON CONFLICT (name) DO UPDATE SET decrypted_secret = EXCLUDED.decrypted_secret;" -q
          psql -c "INSERT INTO vault.decrypted_secrets (name, decrypted_secret) VALUES ('service_role_key', 'test-service-role-key-ci') ON CONFLICT (name) DO UPDATE SET decrypted_secret = EXCLUDED.decrypted_secret;" -q
          
          # Apply migrations
          for migration in supabase/migrations/*.sql; do
            echo "Applying $(basename $migration)..."
            psql -f "$migration" -q -v ON_ERROR_STOP=1
          done
          
          # Apply service_role grants
          psql -f scripts/db/post-migration-grants.sql -q
      
      - name: Run SQL tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: visionbuild_test
        run: |
          # Fail if supabase/tests/*.sql exists (they never run)
          if ls supabase/tests/*.sql 2>/dev/null; then
            echo "❌ Found SQL files in supabase/tests/ - they never run!"
            echo "SQL tests must be in scripts/sql-tests/"
            exit 1
          fi
          
          SQL_FILE_COUNT=$(ls -1 scripts/sql-tests/*.sql 2>/dev/null | wc -l)
          echo "Running $SQL_FILE_COUNT SQL test files..."
          
          for test_file in scripts/sql-tests/*.sql; do
            echo "Running $(basename $test_file)..."
            psql -f "$test_file" -v ON_ERROR_STOP=1
          done
      
      - name: Run unit tests
        run: npm test
      
      - name: Run function tests
        run: npm run fn:test
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      
      - name: Start Supabase local stack
        env:
          SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID: "dummy-client-id"
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: "dummy-secret"
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "dummy-client-id"
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "dummy-secret"
        run: |
          supabase start
          # Wait for services to be ready
          timeout 60 bash -c 'until curl -s http://127.0.0.1:54321/rest/v1/ > /dev/null; do sleep 2; done' || echo "Supabase may not be fully ready"
      
      - name: Run storage integration test
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
        run: |
          deno run --allow-net --allow-env --allow-read scripts/integration-tests/test-storage-deletion-comprehensive.ts
      
      - name: Stop Supabase
        if: always()
        run: supabase stop || true
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Check Playwright test count
        run: |
          LISTED_COUNT=$(npx playwright test --list | grep -c "›" || echo "0")
          FOUND_COUNT=$(grep -rn "test(" e2e/*.spec.ts | grep -v "test.describe" | grep -v "//" | wc -l)
          echo "Listed tests: $LISTED_COUNT"
          echo "test() calls in spec files: $FOUND_COUNT"
          if [ "$LISTED_COUNT" != "$FOUND_COUNT" ]; then
            echo "ERROR: Test count mismatch! Listed: $LISTED_COUNT, Found: $FOUND_COUNT"
            echo "Some tests may not be discovered by Playwright. Check test file structure."
            exit 1
          fi
          echo "✓ Test discovery validation passed"
      
      - name: Run E2E Web Tests
        run: npm run e2e:web
        env:
          EXPO_PUBLIC_DEV_MOCK_SESSION: "true"
          CI: "true"
      
      - name: Verify screenshot dimensions
        run: |
          echo "Checking screenshot dimensions (expected 780x1688 at DSF 2)..."
          
          # Install ImageMagick if not present
          if ! command -v identify &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          
          PLAYWRIGHT_START=$(date -r playwright-report +%s 2>/dev/null || date -r e2e/screens +%s)
          
          FAIL=0
          for screenshot in e2e/screens/ui-*.png; do
            if [ ! -f "$screenshot" ]; then
              continue
            fi
            
            # Skip ui-contact-sheet.png (composite generated after tests)
            if [[ "$screenshot" == *"ui-contact-sheet.png" ]]; then
              # Check it's newer than Playwright start
              SHOT_TIME=$(date -r "$screenshot" +%s)
              if [ $SHOT_TIME -lt $PLAYWRIGHT_START ]; then
                echo "❌ $screenshot is stale (older than test run)"
                FAIL=1
              else
                echo "✓ $screenshot (composite, regenerated)"
              fi
              continue
            fi
            
            # Check if file was modified in this run (within last 10 minutes)
            if [ $(find "$screenshot" -mmin -10 2>/dev/null | wc -l) -eq 0 ]; then
              echo "❌ $screenshot was not regenerated in this test run"
              FAIL=1
              continue
            fi
            # Check dimensions with identify (ImageMagick)
            DIMS=$(identify -format "%wx%h" "$screenshot" 2>/dev/null || echo "error")
            if [ "$DIMS" = "error" ]; then
              echo "❌ $screenshot could not be read (corrupted?)"
              FAIL=1
            elif [ "$DIMS" != "780x1688" ]; then
              echo "❌ $screenshot is $DIMS (expected 780x1688)"
              FAIL=1
            else
              echo "✓ $screenshot is $DIMS"
            fi
          done
          
          # Regenerate ui-contact-sheet.png from all current ui-* shots
          montage e2e/screens/ui-!(contact-sheet).png -tile 4x -geometry 195x422+2+2 -background white e2e/screens/ui-contact-sheet.png
          echo "✓ Regenerated ui-contact-sheet.png"
          
          if [ $FAIL -eq 1 ]; then
            echo ""
            echo "Screenshot check failed. All ui-* screenshots must be 780x1688 and regenerated during the test run."
            exit 1
          fi
          echo "✅ All screenshots are 780x1688 and were regenerated."
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Upload E2E Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screens/
          retention-days: 30
