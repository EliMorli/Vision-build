name: visionbuild
description: Home renovation visualization tool — from imagination to contractor execution.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  cloud_functions: ^5.2.0

  # Google Sign-In
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # AI / Networking
  google_generative_ai: ^0.4.6
  http: ^1.2.1
  dio: ^5.4.3

  # Image handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0
  card_swiper: ^3.0.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
